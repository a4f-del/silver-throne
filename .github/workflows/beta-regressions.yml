name: BETA — regresii JavaScript

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regressions:
    name: Teste Node.js fără acces la date reale
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificare sintaxă scripturi și teste
        shell: bash
        run: |
          set -euo pipefail
          for script in ./*.js dev/test-*.js dev/smoke-beta-screens.mjs; do
            node --check "$script"
          done
      - name: Suita de regresii BETA
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          total=0
          for test in dev/test-*.js; do
            total=$((total+1))
            echo "::group::$test"
            if ! node "$test"; then
              failures=$((failures+1))
              echo "::error title=Test eșuat::$test"
            fi
            echo "::endgroup::"
          done
          echo "Rezultat: $((total-failures))/$total teste trecute"
          test "$failures" -eq 0
