<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700&family=Alegreya+SC:wght@500;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--hh:64px;--bg:#0b0e10;--panel:#161b1e;--panel2:#1d2427;--ink:#e9e1cf;--mute:#9b9483;--line:#4e4224;--gold:#c9a24b;--gold2:#f0d27a;--acc:#4fa35e;--ember:#d99a3a;--blood:#d4564f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Alegreya,Georgia,serif}
body{background:radial-gradient(1200px 600px at 50% -10%,#1f282b 0,transparent 70%) fixed,repeating-linear-gradient(45deg,#0d1113 0 6px,#0b0e10 6px 12px) fixed;padding:env(safe-area-inset-top,0px) 0 calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:Cinzel,"Alegreya SC",Georgia,serif;margin:0;font-weight:700}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(180deg,#1b2124,#101416);border-bottom:2px solid var(--gold);box-shadow:0 2px 12px #000c}
header h1{font-size:22px;letter-spacing:.08em;color:var(--gold2);text-shadow:0 1px 0 #000,0 0 12px #c9a24b55;white-space:nowrap;display:flex;align-items:center;gap:8px;text-transform:uppercase}
header h1 .cr{font-size:20px}
.hs{display:flex;gap:8px;flex:1;justify-content:flex-end;align-items:center;min-width:0}
.rc,.lvb{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;background:linear-gradient(180deg,#0e1214,#161b1e);border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 0 0 1px #000;white-space:nowrap}
.rc svg{width:28px;height:28px;flex:none}
.rc b,.lvb b{display:block;font-size:17px;line-height:1.1;color:var(--ink)}
.rc small,.lvb small{display:block;font-size:12px;color:var(--mute);line-height:1.1}
.xpb{display:block;height:5px;background:#000;margin-top:3px;border:1px solid var(--line)}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,#b8860b,var(--gold2))}
main{max-width:860px;margin:0 auto;padding:14px}
section{position:relative;background:linear-gradient(180deg,#1d2427,#141a1c);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:12px 14px;margin:0 0 14px;box-shadow:inset 0 0 0 1px #000,inset 0 0 24px #0008,0 3px 10px #0008}
section h2{font-size:18px;letter-spacing:.05em;color:var(--gold2);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid;border-image:linear-gradient(90deg,var(--gold),transparent) 1}
section>.row{padding:8px 0;border-bottom:1px solid #ffffff0d;margin:0}
section>.row:last-child{border-bottom:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0}
button,select{font:inherit;color:var(--ink);background:linear-gradient(180deg,#2a3236,#171d20);border:1px solid #6b5a30;padding:7px 12px;border-radius:4px;box-shadow:inset 0 1px 0 #ffffff14,0 1px 2px #000a}
select option{background:#14191b;color:var(--ink)}
button{cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.2);border-color:var(--gold)}
button.p{background:linear-gradient(180deg,#4fa35e,#2d6b3a);border-color:#8fd19b;color:#fff;font-weight:700;text-shadow:0 1px 1px #000a}
button.d{border-color:var(--blood);color:#ff9d96;background:linear-gradient(180deg,#34201f,#1d1212)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
input{font:inherit;color:var(--ink);background:#0b0e10;border:1px solid var(--line);padding:7px 10px;border-radius:4px;width:9em}
.bar{height:8px;background:#05080a;border:1px solid var(--line);margin:3px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2d6b3a,#5fbf70)}
.bar.e i{background:linear-gradient(90deg,#7d2420,var(--blood))}
.mute{color:var(--mute);font-size:15px}
.msg{border:1px solid var(--ember);border-left:4px solid var(--ember);background:linear-gradient(180deg,#2a2112,#171209);padding:8px 12px;margin:0 0 14px;border-radius:4px}
.log{font-size:15px;color:var(--mute);margin:6px 0}
.log div:last-child{color:var(--ink)}
.en{width:100%;text-align:left;margin:4px 0;display:block}
.en.t{border-color:var(--ember);box-shadow:inset 3px 0 var(--ember)}
.r1{color:#c4bfae}.r2{color:#5fc470}.r3{color:var(--ember)}.r4{color:var(--blood)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 14px;padding-bottom:0;border-bottom:1px solid var(--gold);scrollbar-width:thin}
.tabs button{flex:none;border-radius:4px 4px 0 0;font-family:Cinzel,serif;font-weight:700;font-size:13px;color:var(--mute);background:linear-gradient(180deg,#181e21,#0e1214)}
.tabs button.p{background:linear-gradient(180deg,#4a3b17,#241c0b);color:var(--gold2);border-color:var(--gold);text-shadow:none}
.hero{position:relative;min-height:190px;margin:0 0 14px;border:1px solid var(--gold);border-radius:4px;display:flex;flex-direction:column;justify-content:space-between;gap:70px;padding:12px;background:linear-gradient(180deg,#0003 0,#000b 100%),radial-gradient(circle at 70% 30%,#3b4a3f,#12181a 70%);box-shadow:inset 0 0 0 1px #000,0 4px 14px #000a}
.hero-in{display:flex;align-items:center;gap:10px;align-self:flex-start;padding:6px 14px 6px 8px;background:#0b0e10cc;border:1px solid var(--gold);border-radius:6px}
.crest{font-size:30px;line-height:1}
.hero-in b{display:block;font-family:Cinzel,serif;color:var(--gold2);font-size:18px;line-height:1.2}
.hero-in small{color:var(--mute)}
.hero-cta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#0b0e10cc;border:1px solid var(--line);border-radius:4px}
.hero-cta>span:first-child{font-family:Cinzel,serif;font-weight:700;color:var(--gold2)}
.ico{position:relative;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-right:6px;vertical-align:middle;background:#0b0e10;border:1px solid var(--line);border-radius:4px;font-size:16px;overflow:hidden}
.ico img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.ico.q1{border-color:var(--acc)}.ico.q2{border-color:var(--ember)}.ico.q3{border-color:var(--blood)}
.avw{position:relative;display:inline-block;flex:none;border-radius:50%;overflow:hidden}
.avw>svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.avw img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid var(--gold)}
.bl{display:flex;align-items:center;gap:10px}
.thumb{position:relative;flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#2c3a30,#12181a);border:1px solid var(--gold);border-radius:4px;overflow:hidden}
.thumb img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:linear-gradient(180deg,#1b2124,#0e1214);border-top:2px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;box-shadow:none;padding:8px 4px;font-family:Cinzel,serif;font-weight:700;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav .ni{font-size:22px;line-height:1}
nav button.on{color:var(--gold2);background:linear-gradient(180deg,#3a2f15,#1a1608);box-shadow:inset 0 3px var(--gold)}
@media (max-width:959px){
header{flex-wrap:wrap;padding:6px 10px;padding-right:84px;gap:4px}
header h1{font-size:17px}
.hs{flex:1 1 100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px}
.rc{padding:3px 8px 3px 6px;gap:5px}.rc svg{width:22px;height:22px}
.rc b,.lvb b{font-size:15px}.lvb b{display:none}.lvb{padding:3px 8px 3px 6px}
main{padding:10px}
.hero{min-height:150px;gap:40px}
}
@media (min-width:960px){
body{padding:calc(var(--hh) + 14px) 0 24px 210px}
header{position:fixed;left:0;right:0;height:var(--hh);padding-right:110px}
nav{top:var(--hh);right:auto;bottom:0;width:210px;flex-direction:column;justify-content:flex-start;gap:6px;padding:14px 10px;border-top:0;border-right:2px solid var(--gold);background:linear-gradient(90deg,#1b2124,#101416)}
nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(180deg,#181e21,#0e1214)}
nav button.on{box-shadow:inset 4px 0 var(--gold);border-color:var(--gold)}
main{padding:8px 24px;max-width:940px}
}
/* ===== Legendary items + premium hero (efecte vizuale) ===== */
[data-fx=runic]{--c1:#f0d27a;--c2:#49b6ff}
/* exemplu pentru un viitor legendar: [data-fx=ember]{--c1:#ffb35a;--c2:#ff4d2e} */
.rl{color:#f0d27a;text-shadow:0 0 8px #c9a24b66}
.ico.lg{width:46px;height:46px;cursor:pointer;isolation:isolate;overflow:visible;border:1px solid var(--c1);background:#141416;animation:lgGlow 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.ico.lg::before{content:"";position:absolute;top:-4px;right:-4px;bottom:-4px;left:-4px;border-radius:8px;background:conic-gradient(from 0deg,var(--c1),transparent 28%,var(--c2),transparent 62%,var(--c1));opacity:.55;filter:blur(3px);z-index:-1;animation:lgSpin 7s linear infinite}
.ico.lg .lgi{border-radius:3px;z-index:1}.ico.lg .rn{z-index:2;opacity:.8}.ico.lg .pt{z-index:3}
.ico.lg .rn{position:absolute;left:50%;top:50%;width:70%;height:70%;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(73,182,255,.55),transparent);mix-blend-mode:screen;pointer-events:none;animation:lgPulse 2.4s ease-in-out infinite}
.pt{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--c2);box-shadow:0 0 5px var(--c2);opacity:0;pointer-events:none;--rise:-34px;animation:lgRise 3.4s ease-in infinite}
.pt.a{left:20%;bottom:8%}.pt.b{left:52%;bottom:14%;animation-delay:1.1s;--dx:6px}.pt.c{left:80%;bottom:6%;animation-delay:2.2s;--dx:-5px}
.pt.d{left:34%;bottom:20%;animation-delay:.6s;--dx:-8px}.pt.e{left:66%;bottom:10%;animation-delay:1.7s;--dx:9px}.pt.f{left:46%;bottom:4%;animation-delay:2.8s}
.ico.lg .pt.d,.ico.lg .pt.e,.ico.lg .pt.f{display:none}
.ico.lg.sel{animation:lgPop .6s cubic-bezier(.2,.8,.2,1),lgGlow 3.2s ease-in-out infinite}
.lgm{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10001;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 40%,#0c1a2a99,#000d);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:lgIn .25s ease-out}
.lgm.out{animation:lgOut .2s ease-in forwards}
.lgm-b{position:relative;width:min(92vw,380px);max-height:92vh;overflow:auto;text-align:center;padding:18px 16px;border:1px solid var(--gold);border-radius:10px;background:linear-gradient(180deg,#1d2427,#0f1315);box-shadow:0 0 40px #49b6ff33,inset 0 0 0 1px #000}
.lgm-b.pv{width:auto;padding:10px;background:none;border:0;box-shadow:none;overflow:visible}
.lgm-b h3{color:var(--gold2);font-size:22px;letter-spacing:.05em;margin-top:6px;text-shadow:0 0 14px #c9a24b66}
.lgm-d{margin-top:6px;color:#9ad7ff}
.lgm-x{position:absolute;top:8px;right:8px;z-index:3;padding:2px 9px}
.lgm-st{position:relative;height:min(46vh,380px);display:flex;align-items:center;justify-content:center;margin-top:8px}
.lgm-aura{z-index:0;position:absolute;top:6%;right:18%;bottom:6%;left:18%;background:radial-gradient(closest-side,rgba(73,182,255,.38),rgba(240,210,122,.12) 55%,transparent);filter:blur(6px);animation:lgPulse 3s ease-in-out infinite}
.lgm-img{position:relative;height:100%;width:auto;max-width:100%;object-fit:contain;z-index:1;animation:lgFloat 5s ease-in-out infinite}
.lgm-st .rn{position:absolute;left:50%;top:32%;width:90px;height:22%;translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(90,200,255,.6),transparent);mix-blend-mode:screen;pointer-events:none;animation:lgPulse 2.2s ease-in-out infinite}
.lgm-st .rn{z-index:2}.lgm-st .pt{z-index:3;--rise:-230px;width:4px;height:4px;animation-duration:5s}
.lgm-st .pt.a{left:40%;bottom:12%}.lgm-st .pt.b{left:56%;bottom:20%}.lgm-st .pt.c{left:48%;bottom:8%}
.pcard{--px:0;--py:0;position:relative;width:min(100%,360px);aspect-ratio:848/1264;margin:12px auto;border:1px solid var(--gold);border-radius:12px;overflow:hidden;background:#05080b;box-shadow:0 0 0 1px #000,0 8px 30px #000b,0 0 28px #49b6ff22;isolation:isolate;touch-action:pan-y}
.pcard.big{width:min(92vw,calc(86vh*848/1264),520px)}
.pc-bg{z-index:0;position:absolute;top:-10%;right:-10%;bottom:-10%;left:-10%;background:center/cover no-repeat;filter:saturate(1.25) brightness(.8);translate:calc(var(--px)*-16px) calc(var(--py)*-12px);transition:translate .35s ease-out;animation:pcDrift 18s ease-in-out infinite alternate}
.pc-fig{z-index:1;position:absolute;top:0;right:0;bottom:0;left:0;translate:calc(var(--px)*9px) calc(var(--py)*7px);transition:translate .25s ease-out;animation:pcBreathe 14s ease-in-out infinite alternate;}
.pc-fig img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.pc-g{position:absolute;pointer-events:none;mix-blend-mode:screen;border-radius:50%;animation:pcPulse 3.4s ease-in-out infinite}
.pc-g.eyes{left:38%;top:15.5%;width:26%;height:8%;background:radial-gradient(closest-side,rgba(150,230,255,.9),transparent)}
.pc-g.rune{left:36%;top:40%;width:38%;height:18%;background:radial-gradient(closest-side,rgba(60,170,255,.55),transparent);animation-delay:.7s}
.pc-g.blade{left:0;top:68%;width:100%;height:28%;background:radial-gradient(closest-side,rgba(70,180,255,.4),transparent);animation-delay:1.4s}
.pc-g.tl{left:-6%;top:22%;width:26%;height:18%;background:radial-gradient(closest-side,rgba(255,160,60,.55),transparent);animation:pcFlick 1.7s ease-in-out infinite}
.pc-g.tr{left:80%;top:23%;width:26%;height:18%;background:radial-gradient(closest-side,rgba(255,160,60,.55),transparent);animation:pcFlick 2.1s ease-in-out infinite .4s}
.pc-cv{z-index:2;position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;translate:calc(var(--px)*18px) calc(var(--py)*14px);transition:translate .2s ease-out}
.pc-shine{z-index:2;position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(105deg,transparent 40%,rgba(180,230,255,.22) 50%,transparent 60%);translate:-120% 0;animation:pcShine 7s ease-in-out infinite}
.pc-cap{z-index:3;position:absolute;left:0;right:0;bottom:0;padding:38px 12px 10px;text-align:center;background:linear-gradient(0deg,#000d,transparent);pointer-events:none}
.pc-cap b{display:block;font-family:Cinzel,serif;color:var(--gold2);font-size:19px;letter-spacing:.06em;text-shadow:0 0 12px #c9a24b88}
.pc-cap small{color:#9ad7ff}

.pcard::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 88% 92% at 50% 48%,transparent 64%,rgba(3,6,9,.65) 100%)}
@supports not (aspect-ratio:1){.pcard{height:0;padding-bottom:149%}}
.pcard.miss::before,.ico.miss::before{outline:0}
.pcard.miss{outline:2px solid var(--blood)}
.ico.lg.miss{border-color:var(--blood)}
#miss{position:fixed;left:8px;right:8px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:10002;background:#3a1210;border:1px solid var(--blood);color:#ffd2cc;padding:8px 40px 8px 12px;border-radius:6px;font-size:14px;line-height:1.35;word-break:break-all;box-shadow:0 4px 18px #000b}
#miss button{position:absolute;top:6px;right:6px;padding:0 8px}
@media (min-width:960px){#miss{left:220px;bottom:12px}}
@keyframes lgGlow{0%,100%{box-shadow:0 0 6px 1px rgba(240,210,122,.3),0 0 14px 2px rgba(73,182,255,.18)}50%{box-shadow:0 0 10px 2px rgba(240,210,122,.55),0 0 22px 4px rgba(73,182,255,.38)}}
@keyframes lgSpin{to{transform:rotate(360deg)}}
@keyframes lgPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes lgRise{0%{translate:0 0;opacity:0}15%{opacity:.9}100%{translate:var(--dx,0) var(--rise);opacity:0}}
@keyframes lgPop{0%{transform:scale(1)}35%{transform:scale(1.22);filter:brightness(1.7)}100%{transform:scale(1)}}
@keyframes lgIn{from{opacity:0}to{opacity:1}}
@keyframes lgOut{to{opacity:0}}
@keyframes lgFloat{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes pcDrift{from{scale:1.08;rotate:-.4deg}to{scale:1.14;rotate:.4deg}}
@keyframes pcBreathe{from{scale:1.02}to{scale:1.06}}
@keyframes pcPulse{0%,100%{opacity:.3}50%{opacity:.95}}
@keyframes pcFlick{0%,100%{opacity:.5}20%{opacity:.85}40%{opacity:.4}60%{opacity:.95}80%{opacity:.6}}
@keyframes pcShine{0%,55%{translate:-120% 0}100%{translate:120% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.pc-cv,.pt,.pc-shine{display:none!important}.pc-g{opacity:.5}.ico.lg .rn{opacity:.5}}
.st-map{position:relative;border:1px solid var(--line);box-shadow:inset 0 0 0 1px #000,0 2px 10px #000a;background:#1f2a22;line-height:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#stmap{display:block;cursor:grab}
#stmap:active{cursor:grabbing}
.st-v{cursor:pointer;outline:none}
.st-sel{opacity:0;transition:opacity .15s}
.st-v.on .st-sel,.st-v:focus-visible .st-sel{opacity:1}
.st-v:hover .st-sel{opacity:.6}
.st-v.on:hover .st-sel{opacity:1}
.st-nm{opacity:0;transition:opacity .15s;pointer-events:none}
.st-v.on .st-nm,.st-v:hover .st-nm,.st-v:focus-visible .st-nm{opacity:1}
.st-zc{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;line-height:1}
.st-zb{width:34px;height:34px;padding:0;font-size:18px;background:#0b0e10cc}
.st-lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:13px;color:var(--mute)}
.st-lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@keyframes st-sk{0%{transform:translate(0,0) scale(.7);opacity:.55}100%{transform:translate(2px,-11px) scale(1.7);opacity:0}}
@keyframes st-fl{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-6deg) scaleX(.86)}}
@keyframes st-rt{to{stroke-dashoffset:-18}}
@keyframes st-wv{to{stroke-dashoffset:-32}}
.st-sk{animation:st-sk 4.2s linear infinite;transform-box:fill-box;transform-origin:center}
.st-fl{animation:st-fl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
.st-rt{animation:st-rt 1.2s linear infinite}
.st-wv{animation:st-wv 5s linear infinite}
@media (prefers-reduced-motion:reduce){.st-sk,.st-fl,.st-rt,.st-wv{animation:none}}
</style>
